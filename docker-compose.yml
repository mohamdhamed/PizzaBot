# PizzaBot — app + PostgreSQL. No host ports are published: the database is
# reachable only on the private network `pizzabot_net`.
name: pizzabot

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pizzabot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: pizzabot-app
    # Only the connection string — the app never needs the raw POSTGRES_* vars.
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pizzabot_net
    # No long-running service yet: the default command checks the DB and exits.
    command: ["python", "-m", "pizzabot.db.ping"]
    restart: "no"

volumes:
  pgdata:
    name: pizzabot_pgdata

networks:
  pizzabot_net:
    name: pizzabot_net
