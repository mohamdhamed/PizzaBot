# PizzaBot — app (Telegram bot, long polling) + PostgreSQL. No host ports are
# published: the bot only makes outgoing requests to Telegram, and the
# database is reachable only on the private network `pizzabot_net`.
name: pizzabot

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pizzabot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: pizzabot-app
    # Only what the app needs — never the raw POSTGRES_* vars.
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set in .env}
      RESTAURANT_ID: ${RESTAURANT_ID:?set in .env}
      # Tests are mounted read-only (not baked into the image), so pytest
      # must not try to write its cache next to them.
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    volumes:
      - ./tests:/app/tests:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pizzabot_net
    # Applies pending migrations, checks the restaurant and the token, then
    # polls Telegram until stopped.
    command: ["python", "-m", "pizzabot.channels.telegram"]
    restart: unless-stopped
    # SIGTERM interrupts the long poll at once; leave time for an update in progress.
    stop_grace_period: 20s

volumes:
  pgdata:
    name: pizzabot_pgdata

networks:
  pizzabot_net:
    name: pizzabot_net
